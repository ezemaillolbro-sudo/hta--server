
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dice Verification</title>
<style>
body {
  margin: 0;
  min-height: 100vh;
  background: #080b09;
  color: #f4fff7;
  font-family: Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.panel {
  width: 100%;
  max-width: 400px;
  box-sizing: border-box;
  padding: 36px 28px;
  text-align: center;
  background: #101712;
  border: 1px solid #245b38;
  border-radius: 18px;
}
.brand {
  color: #9aafa0;
  letter-spacing: 4px;
  font-size: 12px;
  font-weight: bold;
}
.arrow {
  color: #39ff88;
  font-size: 64px;
  margin: 28px 0 12px;
}
h1 { font-size: 28px; }
p {
  color: #a7b5aa;
  line-height: 1.7;
}
.status {
  color: #39ff88;
  margin: 24px 0;
  font-size: 12px;
  font-weight: bold;
}
.button {
  display: block;
  padding: 16px;
  background: #39ff88;
  color: #07120b;
  text-decoration: none;
  font-weight: bold;
  border-radius: 8px;
}
.footer {
  font-size: 11px;
  margin-top: 22px;
}
</style>
</head>
<body>
<main class="panel">
  <div class="brand">DICE VERIFICATION</div>
  <div class="arrow">&#8593;</div>
  <h1>Dice Verification</h1>
  <p>
    Welcome. Continue to your selected destination.
  </p>
  <div class="status">&#10003; READY TO CONTINUE</div>

  <!-- Set your intended destination URL here -->
  <a class="button"
     href="https://example.com"
     target="_blank"
     rel="noopener noreferrer">
    CONTINUE &#8594;
  </a>

  <p class="footer">
    Check the destination address before continuing.
  </p>
</main>
</body>
</html>
